name: Auto Post Content

on:
  schedule:
    - cron: "0 18 * * *"  # Запуск каждый день в 18:00 UTC (21:00 по Москве)
  workflow_dispatch:  # Возможность запустить вручную

jobs:
  post_content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13.0"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Posting Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: |
          python generate_posts.py

      # 🔹 Добавление новых статей и обновленного индекса в Git
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add blog/*.html blog.html sitemap.xml
          # В дни без темы коммитить нечего — не роняем job
          git diff --cached --quiet && { echo "Нет изменений"; exit 0; }
          git commit -m "📝 Автоматически добавлены новые статьи в блог"
          git push
